version: '3.8'

services:
  # Your FastAPI Backend
  api:
    build: .
    container_name: learnease-backend
    restart: always
    env_file: .env
    expose:
      - "8000" # Only expose internally to Caddy

  # The Caddy Web Server (Handles HTTPS)
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"   # Open standard HTTP
      - "443:443" # Open standard HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile  # Config file
      - caddy_data:/data                  # Save certificates so we don't hit limits
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: